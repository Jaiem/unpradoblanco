<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precios | Un Prado Blanco</title>
  <link rel="stylesheet" href="css/styles.css">
 </head>
<body>

<header class="header-logo">
  <a href="index.html" class="logo-link">
    <div class="logo-container">
      <img src="img/logo.jpg" alt="Un Prado Blanco Logo">
    </div>
    <h1>Un Prado Blanco</h1>
  </a>

  <nav class="ribbon">
    <a href="index.html">Home</a>
    <a href="historia.html">Mi historia</a>
    <a href="proceso.html">Proceso artesanal</a>
    <a href="invitaciones.html">Invitaciones personalizadas</a>
    <a href="papeleria.html">Papelería de boda</a>
    <a href="precios.html" class="active">Precios</a>
    <a href="contacto.html">Contacto</a>
  </nav>
</header>

<main>
  <img src="img/precios/precios.png" alt="Precios Un Prado Blanco" class="img-precios">
</main>

<div id="lightbox" class="lightbox">
  <span class="lightbox-cerrar">&times;</span>
  <div class="lightbox-contenedor">
    <img class="lightbox-imagen" src="" alt="">
  </div>
</div>

<footer>
  <p>© 2026 Un Prado Blanco</p>
</footer>
  
<script src="https://unpkg.com/@panzoom/panzoom@9.4.0/dist/panzoom.min.js"></script>
<script>
let panzoomInstance;
const imgPrecios = document.querySelector('.img-precios');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.querySelector('.lightbox-imagen');
const lightboxCont = document.querySelector('.lightbox-contenedor');
const cerrar = document.querySelector('.lightbox-cerrar');

imgPrecios.addEventListener('click', () => {
  lightbox.style.display = 'flex';
  lightboxImg.src = imgPrecios.src;

  if (panzoomInstance) panzoomInstance.destroy();
  panzoomInstance = Panzoom(lightboxImg, {
    maxScale: 3,
    minScale: 1,
    contain: 'outside',
    cursor: 'grab'
  });

  // Zoom con Ctrl + rueda
  lightboxCont.addEventListener('wheel', e => {
    if (e.ctrlKey) {
      e.preventDefault();
      panzoomInstance.zoomWithWheel(e);
    }
  }, { passive: false });
});

// Cerrar lightbox
cerrar.addEventListener('click', () => {
  lightbox.style.display = 'none';
  if (panzoomInstance) panzoomInstance.reset();
});

// Cerrar al clicar fuera
lightbox.addEventListener('click', e => {
  if (e.target === lightbox) {
    lightbox.style.display = 'none';
    if (panzoomInstance) panzoomInstance.reset();
  }
});
</script>

</body>
</html>
