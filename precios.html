<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precios | Un Prado Blanco</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Cursor de zoom para la imagen */
    .img-precios { cursor: zoom-in; max-width: 100%; height: auto; }
    /* Estilos básicos para el lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .lightbox img { max-width: 90%; max-height: 90%; }
    .lightbox-cerrar {
      position: absolute;
      top: 20px; right: 30px;
      font-size: 3rem;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header class="header-logo">
  <a href="index.html" class="logo-link">
    <div class="logo-container">
      <img src="img/logo.jpg" alt="Un Prado Blanco Logo">
    </div>
    <h1>Un Prado Blanco</h1>
  </a>

  <nav class="ribbon">
    <a href="index.html">Home</a>
    <a href="historia.html">Mi historia</a>
    <a href="proceso.html">Proceso artesanal</a>
    <a href="invitaciones.html">Invitaciones personalizadas</a>
    <a href="papeleria.html">Papelería de boda</a>
    <a href="precios.html" class="active">Precios</a>
    <a href="contacto.html">Contacto</a>
  </nav>
</header>

<main>
  <img src="img/precios/precios.png" alt="Precios Un Prado Blanco" class="img-precios">
</main>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-cerrar">&times;</span>
  <img class="lightbox-imagen" src="" alt="">
</div>

<footer>
  <p>© 2026 Un Prado Blanco</p>
</footer>

<script>
/* ==========================
   LIGHTBOX SIMPLE
========================== */
const imgPrecios = document.querySelector('.img-precios');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.querySelector('.lightbox-imagen');
const cerrar = document.querySelector('.lightbox-cerrar');

imgPrecios.addEventListener('click', () => {
  lightbox.style.display = 'flex';
  lightboxImg.src = imgPrecios.src;
});

cerrar.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

lightbox.addEventListener('click', e => {
  if (e.target === lightbox) {
    lightbox.style.display = 'none';
  }
});
</script>

</body>
</html>
